[package]
name = "crabwalk_compiled_demo"
version = "0.1.0"
edition = "2021"

[lib]
name = "crabwalk_compiled_demo"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.19.0", features = ["extension-module"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = [] }
