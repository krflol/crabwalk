[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "crabwalk"
version = "0.0.1"
description = "An opt-in Rust semantic and native execution layer for Python"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = []

[project.scripts]
crabwalk = "crabwalk.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
asyncio_default_fixture_loop_scope = "function"
