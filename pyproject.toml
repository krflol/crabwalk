[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "crabwalk"
version = "1.0.0"
description = "Compile an explicit Python subset into inspectable, rustc-checked native extensions"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["compiler", "native-extension", "pyo3", "python", "rust"]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Compilers",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/krflol/crabwalk"
Documentation = "https://github.com/krflol/crabwalk/tree/main/Docs"
Repository = "https://github.com/krflol/crabwalk.git"
Issues = "https://github.com/krflol/crabwalk/issues"
Changelog = "https://github.com/krflol/crabwalk/blob/main/CHANGELOG.md"

[project.optional-dependencies]
quality = [
    "mypy==1.15.0",
    "pytest>=8.3,<9",
    "ruff==0.15.17",
]

[project.scripts]
crabwalk = "crabwalk.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
extend-exclude = [".crabwalk"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
warn_unused_ignores = true
files = [
    "src/crabwalk/_version.py",
    "src/crabwalk/build/cache.py",
    "src/crabwalk/build/cargo.py",
    "src/crabwalk/build/fingerprint.py",
    "src/crabwalk/compiler/ir.py",
    "src/crabwalk/compiler/naming.py",
    "src/crabwalk/compiler/codegen.py",
    "src/crabwalk/compiler/validation.py",
    "src/crabwalk/config.py",
    "src/crabwalk/diagnostics.py",
    "src/crabwalk/progress.py",
    "src/crabwalk/service.py",
    "src/crabwalk/wheel.py",
]
