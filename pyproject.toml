[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "crabwalk"
version = "0.0.1"
description = "An opt-in Rust semantic and native execution layer for Python"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = []

[project.optional-dependencies]
quality = [
    "mypy==1.15.0",
    "pytest>=8.3,<9",
    "ruff==0.15.17",
]

[project.scripts]
crabwalk = "crabwalk.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
extend-exclude = [".crabwalk"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
warn_unused_ignores = true
files = [
    "src/crabwalk/_version.py",
    "src/crabwalk/build/cache.py",
    "src/crabwalk/build/cargo.py",
    "src/crabwalk/build/fingerprint.py",
    "src/crabwalk/compiler/ir.py",
    "src/crabwalk/compiler/validation.py",
    "src/crabwalk/config.py",
    "src/crabwalk/diagnostics.py",
    "src/crabwalk/progress.py",
    "src/crabwalk/service.py",
    "src/crabwalk/wheel.py",
]
