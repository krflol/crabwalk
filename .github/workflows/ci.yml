name: Crabwalk CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: quality-generated-rust
      - name: Install quality dependencies
        run: python -m pip install -e ".[quality]"
      - name: Check Python formatting and lint
        run: |
          python -m ruff format --check src tests examples scripts
          python -m ruff check src tests examples scripts
      - name: Verify generated capability documentation
        run: python scripts/update_capabilities.py --check
      - name: Check typed hardening boundary
        run: python -m mypy
      - name: Compile Python sources
        run: python -m compileall -q src tests examples
      - name: Run compiler unit suite
        run: python -m pytest tests/unit -q
      - name: Parse, format, and lint a generated Rust project
        shell: bash
        run: |
          for source in examples/the_rust_book/__init__.py examples/buffer/app.py; do
            generated="$(crabwalk expand "$source")"
            manifest="$(dirname "$(dirname "$generated")")/Cargo.toml"
            cargo fmt --manifest-path "$manifest"
            cargo fmt --manifest-path "$manifest" -- --check
            cargo clippy --quiet --manifest-path "$manifest" --release -- -A warnings -D clippy::correctness
          done

  native-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: ${{ runner.os }}-${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install -e . pytest==8.4.2
      - name: Probe native toolchain
        run: crabwalk doctor
      - name: Run full suite
        run: >-
          python -m pytest -q
          --enforce-capability-contracts
          --capability-evidence="${{ runner.temp }}/capability-evidence.json"
      - name: Upload capability evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: capability-evidence-${{ runner.os }}-py${{ matrix.python }}
          path: ${{ runner.temp }}/capability-evidence.json
          if-no-files-found: error

  intermediate-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: python -m pip install -e . pytest==8.4.2
      - run: python -m pytest tests/unit -q
