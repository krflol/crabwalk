name: Crabwalk Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  verify-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - id: version
        name: Match immutable tag to package version
        shell: bash
        run: |
          version="$(PYTHONPATH=src python -c 'from crabwalk._version import __version__; print(__version__)')"
          test "v${version}" = "${GITHUB_REF_NAME}"
          case "${version}" in
            *dev*|*a*|*b*|*rc*)
              echo "Release tags must identify a final version: ${version}" >&2
              exit 1
              ;;
          esac
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  required-checks:
    needs: verify-version
    uses: ./.github/workflows/ci.yml

  performance-gate:
    needs: [verify-version, required-checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: release-performance
      - name: Enforce versioned cold/warm and 100k lifecycle budgets
        run: |
          python -m pip install -e .
          python benchmarks/run_release_gate.py --output "${{ needs.verify-version.outputs.version }}-performance.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: crabwalk-performance-${{ needs.verify-version.outputs.version }}
          path: ${{ needs.verify-version.outputs.version }}-performance.json
          if-no-files-found: error
          retention-days: 30

  build:
    needs: [verify-version, required-checks, performance-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: crabwalk-performance-${{ needs.verify-version.outputs.version }}
          path: release/evidence
      - name: Build wheel and source distribution once
        run: |
          python -m pip install build==1.5.0 twine==7.0.0
          python -m build
          python -m twine check dist/*
          mkdir -p release/dist
          mv dist/*.whl dist/*.tar.gz release/dist/
          sha256sum release/dist/* release/evidence/* > release/SHA256SUMS
          sha256sum --check release/SHA256SUMS
      - name: Attest exact release distributions
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: "${{ github.workspace }}/release/dist/*"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: crabwalk-release-${{ needs.verify-version.outputs.version }}
          path: release
          if-no-files-found: error
          retention-days: 30

  artifact-smoke:
    needs: [verify-version, build]
    strategy:
      matrix:
        python: ["3.11", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: crabwalk-release-${{ needs.verify-version.outputs.version }}
          path: release
      - name: Verify downloaded release inventory
        run: sha256sum --check release/SHA256SUMS
      - name: Install exact wheel in a clean environment
        shell: bash
        run: |
          python -m venv .wheel-smoke
          .wheel-smoke/bin/python -m pip install pip==26.2.1
          .wheel-smoke/bin/python -m pip install --no-index release/dist/*.whl
          .wheel-smoke/bin/python -c "import crabwalk; assert crabwalk.__version__ == '${{ needs.verify-version.outputs.version }}'"
      - name: Install exact source distribution in a clean environment
        shell: bash
        run: |
          python -m venv .sdist-smoke
          .sdist-smoke/bin/python -m pip install pip==26.2.1
          .sdist-smoke/bin/python -m pip install release/dist/*.tar.gz
          .sdist-smoke/bin/python -c "import crabwalk; assert crabwalk.__version__ == '${{ needs.verify-version.outputs.version }}'"

  publish-pypi:
    needs: [verify-version, build, artifact-smoke]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/crabwalk-lang/${{ needs.verify-version.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: crabwalk-release-${{ needs.verify-version.outputs.version }}
          path: release
      - name: Verify downloaded release inventory
        run: sha256sum --check release/SHA256SUMS
      - name: Publish exact distributions through PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: release/dist

  github-release:
    needs: [verify-version, build, artifact-smoke, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: crabwalk-release-${{ needs.verify-version.outputs.version }}
          path: release
      - name: Verify downloaded release inventory
        run: sha256sum --check release/SHA256SUMS
      - name: Attach the published artifacts and hashes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release/dist/* release/evidence/* release/SHA256SUMS --clobber
          else
            gh release create "${GITHUB_REF_NAME}" release/dist/* release/evidence/* release/SHA256SUMS \
              --verify-tag \
              --title "Crabwalk ${{ needs.verify-version.outputs.version }}" \
              --generate-notes
          fi
